let AGENT_CODE_BY_ID={}, USED_CODES=new Set();

function codeForAgent(a){
  if(AGENT_CODE_BY_ID[a.id])return AGENT_CODE_BY_ID[a.id];
  const base=SHORT_CODE[a.name]||(a.name||"??").slice(0,2).toUpperCase();

}

async function api(path,opts){
  const r=await fetch(path,Object.assign({headers:{"Content-Type":"application/json"}},opts||{}));
  if(!r.ok){let msg="Error "+r.status;try{const d=await r.json();msg=d.detail||msg;}catch(e){}throw new Error(msg);}
  if(r.status===204)return null;
  return r.json();
}

function agentToRecord(a){
  return {id:a.id,n:a.name,orixá:a.orixa||"",grupo:a.group||"General",modelo:a.default_tier||"economy",idioma:"PT/ES",estado:a.status==="active"?"activo":(a.status||"activo"),d:a.description||"",prompt:a.system_prompt||"",tools:a.tools||[],dailyBudget:a.daily_budget_usd,caseMemory:!!a.case_memory};
}

function computeWorkforces(){
  const byGroup={};
  Object.keys(AGENTS).forEach(k=>{const g=AGENTS[k].grupo||"General";(byGroup[g]=byGroup[g]||[]).push(k);});
  WORKFORCES=Object.keys(byGroup).map(g=>({n:g,d:"Equipo de agentes de "+g+".",members:byGroup[g]}));
}

function execToTask(e){
  const code=Object.keys(AGENTS).find(k=>AGENTS[k].id===e.agent_id)||e.agent_id;
  const time=new Date(e.created_at).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  const steps=[["done","Tarea recibida",time]];
  if(e.status==="done")steps.push(["done",e.cached?"Respondida desde caché (costo $0)":"Completada · $"+Number(e.cost_usd).toFixed(4),time]);
  else steps.push(["err","Error: "+(e.error_message||"desconocido"),time]);
  return {id:e.id,ag:code,cli:e.client_name||"—",t:e.input_text||("Ejecución de "+(AGENTS[code]?AGENTS[code].n:"agente")),st:e.status,steps,cost:e.cost_usd,tier:e.tier,result:e.result_text};
}

async function bootstrapAdmin(){
  resetAgentCodes();
  const agents=await api("/api/agents");
  AGENTS={};agents.forEach(a=>{AGENTS[codeForAgent(a)]=agentToRecord(a);});
  computeWorkforces();
  const clients=await api("/api/clients");
  CLIENTS=clients.map(c=>({id:c.id,n:c.name,mail:c.email,ag:c.agents.map(a=>codeForAgent(a)),plan:"—",pais:"",lang:"es",features:{}}));
  const execs=await api("/api/executions");
  TASKS=execs.map(execToTask);
  const usage=await api("/api/usage?period=month");
  CONSUMO={};
  usage.by_agent.forEach(row=>{const code=Object.keys(AGENTS).find(k=>AGENTS[k].id===row.agent_id);if(code)CONSUMO[code]={dia:row.spend_today_usd,mes:row.spend_period_usd};});
  PROFIT=await api("/api/profitability?period=month");
}

async function bootstrapClient(meData){
  resetAgentCodes();
  AGENTS={};
  (meData.agents||[]).forEach(a=>{AGENTS[codeForAgent(a)]=agentToRecord(a);});
  computeWorkforces();
  myClientId=meData.id;
  CLIENTS=[{id:meData.id,n:meData.name,mail:meData.email,ag:Object.keys(AGENTS),plan:"—",pais:"",lang:"es",features:{}}];
  me=meData.name;
  const execs=await api("/api/me/executions");
  TASKS=execs.map(execToTask);
  const usage=await api("/api/me/usage?period=month");
  CONSUMO={};
  usage.by_agent.forEach(row=>{const code=Object.keys(AGENTS).find(k=>AGENTS[k].id===row.agent_id);if(code)CONSUMO[code]={dia:row.spend_today_usd,mes:row.spend_period_usd};});
}

async function refreshExecutions(){
  if(role==="cli"){
    const execs=await api("/api/me/executions");TASKS=execs.map(execToTask);
    const usage=await api("/api/me/usage?period=month");
    usage.by_agent.forEach(row=>{const code=Object.keys(AGENTS).find(k=>AGENTS[k].id===row.agent_id);if(code)CONSUMO[code]={dia:row.spend_today_usd,mes:row.spend_period_usd};});
  }else{
    const execs=await api("/api/executions");TASKS=execs.map(execToTask);
    const usage=await api("/api/usage?period=month");
    usage.by_agent.forEach(row=>{const code=Object.keys(AGENTS).find(k=>AGENTS[k].id===row.agent_id);if(code)CONSUMO[code]={dia:row.spend_today_usd,mes:row.spend_period_usd};});
  }
}

async function runAgentReal(code,inputText){
  const rec=AGENTS[code];
  if(!rec)throw new Error("Agente no encontrado");
  const path=role==="cli"?("/api/me/agents/"+rec.id+"/run"):("/api/agents/"+rec.id+"/run");
  const data=await api(path,{method:"POST",body:JSON.stringify({input:inputText||null})});
  await refreshExecutions();
  return data;
}

/* ---------- CASOS (memoria persistente por paciente) ---------- */
async function loadCasesFor(code){
  const rec=AGENTS[code];
  if(!rec)return;
  const path=role==="cli"?("/api/me/agents/"+rec.id+"/cases"):("/api/agents/"+rec.id+"/cases");
  CASES=await api(path);
}

async function navCases(code){
  await loadCasesFor(code);
  current="cases:"+code;
  render();
}

async function createCaseFor(code){
  const rec=AGENTS[code];
  const label=document.getElementById("new_case_label").value.trim();
  if(!label)return;
  const path=role==="cli"?("/api/me/agents/"+rec.id+"/cases"):("/api/agents/"+rec.id+"/cases");
  const created=await api(path,{method:"POST",body:JSON.stringify({patient_label:label})});
  await loadCasesFor(code);
  await openCase(created.id);
}

async function openCase(caseId){
  currentCaseId=caseId;
  CASE_MESSAGES=await api("/api/cases/"+caseId+"/messages");
  nav("case:"+caseId);
}

async function sendCaseMessage(){
  const el=document.getElementById("casemsg");
  if(!el||!el.value.trim())return;
  const text=el.value.trim();el.value="";
  CASE_MESSAGES.push({role:"user",content:text,created_at:new Date().toISOString()});
  CASE_MESSAGES.push({role:"assistant",content:"⏳ Pensando...",created_at:new Date().toISOString()});
  render();
  try{
    const data=await api("/api/cases/"+currentCaseId+"/message",{method:"POST",body:JSON.stringify({message:text})});
    CASE_MESSAGES[CASE_MESSAGES.length-1].content=data.result;
    CASE_MESSAGES[CASE_MESSAGES.length-1].cost_usd=data.cost_usd;
  }catch(err){
    CASE_MESSAGES[CASE_MESSAGES.length-1].content="⚠️ "+(err.message||err);
  }
  render();
  const log=document.getElementById("caselog");if(log)log.scrollTop=log.scrollHeight;
}

function setRole(r){role=r;document.getElementById("rCli").classList.toggle("on",r==="cli");document.getElementById("rAdm").classList.toggle("on",r==="adm");}

async function login(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const errBox=document.getElementById("loginError");
  const btn=document.getElementById("loginBtn");
  errBox.textContent="";btn.disabled=true;btn.textContent="Entrando...";
  try{
    if(role==="cli"){
      const data=await api("/api/auth/login",{method:"POST",body:JSON.stringify({email,password})});
      await bootstrapClient(data);
    }else{
      const r=await fetch("/api/auth/admin-login",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({username:email,password})});
      if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.detail||"Usuario o contraseña incorrectos");}
      me=email||"Admin";
      await bootstrapAdmin();
    }
    document.getElementById("login").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("roleTag").textContent=role==="cli"?"Cliente":"Admin";
    document.getElementById("whoName").textContent=me;
    current=role==="cli"?"c_tareas":"inicio";
    lang="es";
    render();
  }catch(err){
    errBox.textContent=err.message||String(err);
  }finally{
    btn.disabled=false;btn.textContent="Entrar";
  }
}

async function logout(){
  try{await fetch("/api/auth/logout",{method:"POST"});}catch(e){}
  document.getElementById("app").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
  document.getElementById("loginError").textContent="";
}

async function sendChat(){
  const el=document.getElementById("chatmsg");if(!el||!el.value.trim())return;
  const t=el.value.trim();el.value="";
  CHAT.push({ag:chatAgent,who:"u",t:t});
  CHAT.push({ag:chatAgent,who:"a",t:"⏳ Ejecutando..."});
  render();
  const l=document.getElementById("chatlog");if(l)l.scrollTop=l.scrollHeight;
  try{
    const data=await runAgentReal(chatAgent,t);
    const meta=`[tier: ${data.tier_used}${data.cached?" · desde caché":""} · costo: $${Number(data.cost_usd).toFixed(4)}]\n\n`;
    CHAT[CHAT.length-1].t=meta+data.result;
  }catch(err){
    CHAT[CHAT.length-1].t="⚠️ "+(err.message||err);
  }
  render();
  const l2=document.getElementById("chatlog");if(l2)l2.scrollTop=l2.scrollHeight;
}

function tr(h){if(lang!=="pt")return h;for(var i=0;i<DICT.length;i++){h=h.split(DICT[i][0]).join(DICT[i][1]);}return h;}
function setLang(l){lang=l;render();}
function toggleFeat(i,k){CLIENTS[i].features[k]=!CLIENTS[i].features[k];render();}
function modal(html){document.getElementById("modalHost").innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()" style="position:fixed;inset:0;background:rgba(20,24,33,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50"><div class="lcard" style="width:520px;max-height:88vh;overflow:auto;position:relative"><button onclick="closeModal()" style="position:absolute;top:12px;right:14px;background:none;border:none;font-size:20px;color:var(--muted)">✕</button>${html}</div></div>`;}
function closeModal(){document.getElementById("modalHost").innerHTML="";}
function openTask(id){const t=TASKS.find(x=>x.id===id);if(!t)return;const resultBlock=t.result?`<div class="panel pad" style="margin-top:10px"><b class="mini">Resultado</b><div style="white-space:pre-wrap;font-size:13px;margin-top:6px">${t.result}</div></div>`:'';modal(`<h2 style="margin:0 0 4px">${t.t}</h2><div class="sub">${AGENTS[t.ag]?AGENTS[t.ag].n:t.ag} · ${t.cli} · ${STATUS[t.st]?STATUS[t.st][1]:t.st}${t.tier?' · tier '+t.tier:''}${t.cost!=null?' · $'+Number(t.cost).toFixed(4):''}</div>${feedFor(t)}${resultBlock}`);}
function openNew(){const opts=CLIENTS.find(c=>c.n===me).ag;modal(`<h2 style="margin:0 0 4px">Nueva tarea</h2><div class="sub">Decile a tu agente qué querés</div><label>Agente</label><select id="newtask_ag">${opts.map(a=>`<option value="${a}">${AGENTS[a]?AGENTS[a].n:a}</option>`).join("")}</select><label>¿Qué querés que haga?</label><textarea id="newtask_txt" rows="3" placeholder="Ej: Buscar 30 clientes en Río y preparar invitaciones"></textarea><div class="mini" id="newtask_status"></div><button class="btn full" id="newtask_btn" onclick="submitNewTask()">Enviar al agente</button>`);}
async function submitNewTask(){
  const ag=document.getElementById("newtask_ag").value;
  const txt=document.getElementById("newtask_txt").value.trim();
  const status=document.getElementById("newtask_status");
  const btn=document.getElementById("newtask_btn");
  if(!txt){status.textContent="Escribí qué querés que haga el agente.";return;}
  btn.disabled=true;btn.textContent="Ejecutando... puede tardar unos segundos";status.textContent="";
  try{
    await runAgentReal(ag,txt);
    closeModal();current=role==="cli"?"c_tareas":"ejec";render();
  }catch(err){
    status.textContent="⚠️ "+(err.message||err);btn.disabled=false;btn.textContent="Enviar al agente";
  }
}

document.addEventListener('DOMContentLoaded',async function(){
  try{
    var r=await fetch('/api/auth/me');
    if(!r.ok)return;
    var d=await r.json();
    if(d.role==='admin'){
      role='adm';me=d.username||'Admin';
      await bootstrapAdmin();
      document.getElementById('login').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      document.getElementById('roleTag').textContent='Admin';
      document.getElementById('whoName').textContent=me;
      current='inicio';lang='es';render();
    }else if(d.role==='client'){
      role='cli';
      await bootstrapClient(d);
      document.getElementById('login').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      document.getElementById('roleTag').textContent='Cliente';
      document.getElementById('whoName').textContent=me;
      current='c_tareas';lang='es';render();
    }
  }catch(e){}
});
</script>
