<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar | IEA AGENTIQ</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { margin: 0; }
        .login-main { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 80px); padding: 24px; box-sizing: border-box; }
        .login-card {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 36px 32px;
            width: 340px;
        }
        .login-card h1 { margin: 0 0 18px; font-size: 1.3rem; }
        .login-card label { display: block; font-size: 0.85rem; margin: 14px 0 6px; }
        .login-card input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(205, 163, 73, 0.3);
            box-sizing: border-box;
        }
        .login-card button {
            margin-top: 20px;
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 8px;
            background: var(--emerald);
            color: var(--gold);
            font-weight: 600;
            cursor: pointer;
        }
        #login-error { color: #c0392b; font-size: 0.85rem; margin-top: 10px; min-height: 1.2em; }
    </style>
</head>
<body>
    {% include "_header.html" %}
    <main class="login-main">
        <div class="login-card">
            <h1>Ingresar a tu portal</h1>
            <form id="login-form">
                <label for="email">Email</label>
                <input type="email" id="email" required>
                <label for="password">Contraseña</label>
                <input type="password" id="password" required>
                <div id="login-error"></div>
                <button type="submit">Entrar</button>
            </form>
        </div>
    </main>
    <script>
        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const errorBox = document.getElementById("login-error");
            errorBox.textContent = "";
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            try {
                const resp = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password }),
                });
                if (!resp.ok) {
                    const data = await resp.json();
                    errorBox.textContent = data.detail || "Error al ingresar.";
                    return;
                }
                window.location.href = "/portal";
            } catch (err) {
                errorBox.textContent = "Error de conexión: " + err;
            }
        });
    </script>
</body>
</html>
