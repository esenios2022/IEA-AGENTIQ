document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

+=treeItem(\"a_chat\",\"💬\",\"Chat con agentes\");\n    // Grupo Agentes desplegable\n    h+=`<div class=\"item ${current.startsWith('agent:')?'':''}\" onclick=\"toggle('agentes')\"><span class=\"ic\">🤖<\u002Fspan> Agentes <span class=\"car ${open.agentes?'open':''}\">▶<\u002Fspan><\u002Fdiv>`;\n    if(open.agentes){h+=`<div class=\"children\">`;\n      Object.keys(AGENTS).forEach(k=>{h+=`<div class=\"child ${current==='agent:'+k?'on':''}\" onclick=\"nav('agent:${k}')\"><div class=\"ag\">${k.slice(0,2)}<\u002Fdiv>${AGENTS[k].n}<\u002Fdiv>`;});\n      h+=`<div class=\"addrow\" onclick=\"nav('newagent')\">＋ Nuevo agente<\u002Fdiv><\u002Fdiv>`;}\n    // Grupo Equipos\n    h+=`<div class=\"item\" onclick=\"toggle('equipos')\"><span class=\"ic\">👥<\u002Fspan> Equipos <span class=\"car ${open.equipos?'open':''}\">▶<\u002Fspan><\u002Fdiv>`;\n    if(open.equipos){h+=`<div class=\"children\">`;\n      WORKFORCES.forEach((w,i)=>{h+=`<div class=\"child ${current==='wf:'+i?'on':''}\" onclick=\"nav('wf:${i}')\"><div class=\"ag\" style=\"background:linear-gradient(135deg,#d97706,#f59e0b)\">${w.n.slice(0,1)}<\u002Fdiv>${w.n}<\u002Fdiv>`;});\n      h+=`<div class=\"addrow\" onclick=\"alert('Crear equipo (demo)')\">＋ Nuevo equipo<\u002Fdiv><\u002Fdiv>`;}\n    // Grupo Clientes\n    h+=`<div class=\"item\" onclick=\"toggle('clientes')\"><span class=\"ic\">🏢<\u002Fspan> Clientes <span class=\"car ${open.clientes?'open':''}\">▶<\u002Fspan><\u002Fdiv>`;\n    if(open.clientes){h+=`<div class=\"children\">`;\n      CLIENTS.forEach((c,i)=>{h+=`<div class=\"child ${current==='cli:'+i?'on':''}\" onclick=\"nav('cli:${i}')\">🏢 ${c.n}<\u002Fdiv>`;});\n      h+=`<div class=\"addrow\" onclick=\"alert('Agregar cliente (demo)')\">＋ Nuevo cliente<\u002Fdiv><\u002Fdiv>`;}\n    h+=treeItem(\"ejec\",\"⚡\",\"Ejecuciones\");\n    h+=treeItem(\"tools\",\"🧰\",\"Herramientas\");\n    h+=treeItem(\"a_rent\",\"💰\",\"Rentabilidad\");\n    h+=treeItem(\"a_analitica\",\"📊\",\"Analítica\");\n    h+=treeItem(\"a_catalogo\",\"🛒\",\"Catálogo\");\n    h+=treeItem(\"a_historial\",\"📑\",\"Historial\");\n    h+=treeItem(\"a_api\",\"🔌\",\"Conexión & API\");\n    h+=treeItem(\"a_conocimiento\",\"📚\",\"Conocimiento\");\n    h+=treeItem(\"a_funciones\",\"📦\",\"Funciones\");\n  }\n  h+='<div class=\"item\" onclick=\"toggleHelp()\" style=\"margin-top:6px\"><span class=\"ic\">❓<\u002Fspan> Ayuda<\u002Fdiv>';\n  document.getElementById(\"tree\").innerHTML=tr(h);\n}\nfunction treeItem(v,ic,label){return `<div class=\"item ${current===v?'on':''}\" onclick=\"nav('${v}')\"><span class=\"ic\">${ic}<\u002Fspan> ${label}<\u002Fdiv>`;}\n\n/* ---------- MAIN ---------- */\nfunction render(){renderTree();const V=document.getElementById(\"view\");\n  let crumb=\"\",title=\"\",help=\"\",btn=\"\",body=\"\";\n  const myTasks=role===\"cli\"?TASKS.filter(t=>t.cli===me):TASKS;\n\n  if(current===\"inicio\"){const act=Object.values(AGENTS).filter(a=>a.estado===\"activo\").length;\n    title=\"Inicio\";help=\"Resumen de tu operación. Usá el menú de la izquierda para ver agentes, equipos y clientes.\";\n    body=`<div class=\"kpis\"><div class=\"kpi\"><div class=\"n\">${Object.keys(AGENTS).length}<\u002Fdiv><div class=\"l\">Agentes (${act} activos)<\u002Fdiv><\u002Fdiv><div class=\"kpi\"><div class=\"n\">${WORKFORCES.length}<\u002Fdiv><div class=\"l\">Equipos<\u002Fdiv><\u002Fdiv><div class=\"kpi\"><div class=\"n\">${CLIENTS.length}<\u002Fdiv><div class=\"l\">Clientes<\u002Fdiv><\u002Fdiv><div class=\"kpi\"><div class=\"n\" style=\"color:var(--brand)\">${TASKS.filter(t=>t.st==='run').length}<\u002Fdiv><div class=\"l\">En curso<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"two\"><div class=\"panel pad\"><h3 style=\"margin-top:0\">Ejecuciones recientes<\u002Fh3>${TASKS.slice(0,4).map(taskRow).join(\"\")}<\u002Fdiv><div class=\"panel pad\"><h3 style=\"margin-top:0\">Actividad en vivo<\u002Fh3>${feedFor(TASKS.find(t=>t.st==='run'))}<\u002Fdiv><\u002Fdiv>`;}\n\n  else if(current.startsWith(\"agent:\")){const k=current.split(\":\")[1];body=agentDetail(k);title=AGENTS[k].n;crumb=\"Agentes ›\";help=\"\";btn=`<button class=\"btn alt\" onclick=\"nav('newagent')\">＋ Nuevo agente<\u002Fbutton>`;}\n  else if(current===\"newagent\"){title=\"Nuevo agente\";crumb=\"Agentes ›\";help=\"Completá los datos y tocá Crear. El agente va a aparecer en la lista de la izquierda.\";body=newAgentForm();}\n  else if(current===\"ejec\"){title=\"Ejecuciones\";help=\"Todas las tareas de todos los clientes. Tocá una para ver el detalle.\";\n    body=`<div class=\"panel\"><table><thead><tr><th>Tarea<\u002Fth><th>Cliente<\u002Fth><th>Agente<\u002Fth><th>Estado<\u002Fth><\u002Ftr><\u002Fthead><tbody>${TASKS.map(t=>`<tr onclick=\"openTask(${t.id})\"><td><b>${t.t}<\u002Fb><\u002Ftd><td>${t.cli}<\u002Ftd><td class=\"mini\">${AGENTS[t.ag].n}<\u002Ftd><td>${badge(t.st)}<\u002Ftd><\u002Ftr>`).join(\"\")}<\u002Ftbody><\u002Ftable><\u002Fdiv>`;}\n  else if(current===\"tools\"){title=\"Herramientas & Integraciones\";help=\"Activá cada herramienta y configurá su API key. Igual que CrewAI — tus agentes usan las herramientas habilitadas acá.\";\n    let tbody=\"\";\n    Object.keys(TOOLS_CAT).forEach(cat=>{\n      tbody+=`<div class=\"panel pad\" style=\"margin-bottom:14px\"><h3 style=\"margin:0 0 12px;font-size:13px;color:var(--brand);text-transform:uppercase;letter-spacing:.5px\">${cat}<\u002Fh3>`;\n      TOOLS_CAT[cat].forEach(t=>{\n        const kn=TOOLS_KEY[t];\n        const on=ACTIVE_TOOLS.has(t);\n        tbody+=`<div class=\"toolrow\" style=\"flex-wrap:wrap;align-items:flex-start\"><div style=\"flex:1;min-width:180px\"><b>${t}<\u002Fb>${kn?`<span class=\"tag2\" style=\"background:rgba(176,141,87,.15);color:#8a6d2f;margin-left:6px\">${kn}<\u002Fspan>`:\"\"}<\u002Fdiv><div class=\"sw ${on?'':'off'}\" onclick=\"toggleTool('${t}',this)\"><\u002Fdiv>${kn?`<input type=\"password\" id=\"tk_${t.replace(/[^a-z]/gi,'_')}\" placeholder=\"Pegar ${kn}...\" value=\"${localStorage.getItem('tk_'+t)||''}\" style=\"width:100%;margin-top:8px;font-size:12px\">`:\"\"}<\u002Fdiv>`;\n      });\n      tbody+=`<\u002Fdiv>`;\n    });\n    body=tbody+`<button class=\"btn\" style=\"margin-top:4px\" onclick=\"saveToolKeys()\">💾 Guardar configuración<\u002Fbutton>`;\n  }\n  else if(current.startsWith(\"wf:\")){const w=WORKFORCES[current.split(\":\")[1]];title=w.n;crumb=\"Equipos ›\";help=w.d+\" Un equipo trabaja coordinado por un jefe (orquestador).\";\n    body=`<div class=\"wf\"><div class=\"orch\"><div class=\"ag\">J<\u002Fdiv><div><b>Jefe del equipo (orquestador)<\u002Fb><div class=\"mini\">Reparte el trabajo y junta los resultados.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"members\">${w.members.map(m=>`<div class=\"member\"><div class=\"ag\">${m.slice(0,2)}<\u002Fdiv>${AGENTS[m].n}<\u002Fdiv>`).join(\"\")}<\u002Fdiv><\u002Fdiv>`;}\n  else if(current.startsWith(\"cli:\")){const ci=parseInt(current.split(\":\")[1]);const c=CLIENTS[ci];title=c.n;crumb=\"Clientes ›\";help=\"Plan \"+c.plan+\" · \"+c.mail;\n    btn=`<button class=\"btn alt\" style=\"color:var(--red);border-color:var(--red)\" onclick=\"deleteClient(${ci})\">🗑 Eliminar<\u002Fbutton>`;\n    const cf=c.features||{};\n    const available=Object.keys(AGENTS).filter(a=>c.ag.indexOf(a)<0);\n    let fr=FEATURES.map(ff=>ff.estado===\"ok\"?`<div class=\"toolrow\"><div>${ff.ic} ${ff.n}<\u002Fdiv><div class=\"sw ${cf[ff.k]?\"\":\"off\"}\" onclick=\"toggleFeat(${ci},'${ff.k}')\"><\u002Fdiv><\u002Fdiv>`:`<div class=\"toolrow\" style=\"opacity:.55\"><div>${ff.ic} ${ff.n} <span class=\"tag2\" style=\"background:rgba(176,141,87,.18);color:#8a6d2f\">Próximamente<\u002Fspan><\u002Fdiv><\u002Fdiv>`).join(\"\");\n    body=`<div class=\"two\" style=\"margin-bottom:16px\">\n    <div class=\"panel pad\"><h3 style=\"margin-top:0\">Datos del cliente<\u002Fh3>\n    <label>Nombre<\u002Flabel><input id=\"cn_n\" value=\"${c.n}\">\n    <label>Email<\u002Flabel><input id=\"cn_m\" value=\"${c.mail}\">\n    <label>Plan<\u002Flabel><select id=\"cn_p\"><option${c.plan===\"Inicial\"?\" selected\":\"\"}>Inicial<\u002Foption><option${c.plan===\"Pro\"?\" selected\":\"\"}>Pro<\u002Foption><option${c.plan===\"Ecosistema\"?\" selected\":\"\"}>Ecosistema<\u002Foption><option${c.plan===\"Cristal\"?\" selected\":\"\"}>Cristal<\u002Foption><\u002Fselect>\n    <label>País<\u002Flabel><input id=\"cn_c\" value=\"${c.pais||''}\">\n    <label>Idioma<\u002Flabel><select id=\"cn_l\"><option value=\"es\"${c.lang===\"es\"?\" selected\":\"\"}>Español<\u002Foption><option value=\"pt\"${c.lang===\"pt\"?\" selected\":\"\"}>Português<\u002Foption><\u002Fselect>\n    <div class=\"actions\"><button class=\"btn\" onclick=\"saveClient(${ci})\">💾 Guardar datos<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n    <div class=\"panel pad\"><h3 style=\"margin-top:0\">Agentes asignados (${c.ag.length})<\u002Fh3>\n    ${c.ag.map(a=>`<div class=\"row\" style=\"padding:8px 0;border-bottom:1px solid var(--line)\">\n      <div class=\"ag\">${a.slice(0,2)}<\u002Fdiv>\n      <div style=\"flex:1\"><b>${AGENTS[a].n}<\u002Fb><div class=\"mini\" style=\"color:var(--amber)\">${AGENTS[a].orixá}<\u002Fdiv><div class=\"mini\">${AGENTS[a].d}<\u002Fdiv><\u002Fdiv>\n      <button onclick=\"removeAgent(${ci},'${a}')\" style=\"background:none;border:1px solid #ddd;border-radius:6px;padding:4px 10px;font-size:12px;color:var(--red);cursor:pointer\">✕ Quitar<\u002Fbutton>\n    <\u002Fdiv>`).join(\"\")}\n    ${available.length?`<div style=\"margin-top:12px;border-top:1px solid var(--line);padding-top:12px\">\n    <div class=\"mini\" style=\"font-weight:700;margin-bottom:8px\">➕ Agregar agente:<\u002Fdiv>\n    <div style=\"display:flex;gap:8px\"><select id=\"ag_sel_${ci}\" style=\"flex:1\">${available.map(a=>`<option value=\"${a}\">${AGENTS[a].n} — ${AGENTS[a].orixá}<\u002Foption>`).join('')}<\u002Fselect>\n    <button class=\"btn\" onclick=\"addAgent(${ci})\">Agregar<\u002Fbutton><\u002Fdiv><\u002Fdiv>`:'<div class=\"mini\" style=\"margin-top:10px;color:var(--green)\">✓ Todos los agentes asignados<\u002Fdiv>'}\n    <\u002Fdiv><\u002Fdiv>\n    <div class=\"panel pad\"><h3 style=\"margin-top:0\">Funciones habilitadas<\u002Fh3><div class=\"mini\" style=\"margin-bottom:8px\">Prendé las funciones extra que querés que vea este cliente.<\u002Fdiv>${fr}<\u002Fdiv>`;}\n\n  else if(current===\"a_rent\"){title=\"Rentabilidad\";help=\"Lo que te deja cada cliente: lo que te paga de suscripción menos tu costo operativo (lo que consumen sus agentes). Así ves tu ganancia real, aunque el cliente solo pague un plan fijo.\";\n    let r=\"\",ti=0,tc=0;\n    CLIENTS.forEach(c=>{const ing=PLAN_PRICE[c.plan]||0;let cost=0;c.ag.forEach(a=>{if(CONSUMO[a])cost+=CONSUMO[a].dia*30;});const gan=ing-cost;const mg=ing?Math.round(gan/ing*100):0;ti+=ing;tc+=cost;r+=\"<tr><td><b>\"+c.n+\"<\u002Fb><div class='mini'>\"+c.plan+\"<\u002Fdiv><\u002Ftd><td>$\"+ing.toFixed(2)+\"<\u002Ftd><td>$\"+cost.toFixed(2)+\"<\u002Ftd><td style='font-weight:800;color:\"+(gan>=0?\"var(--green)\":\"var(--red)\")+\"'>$\"+gan.toFixed(2)+\"<\u002Ftd><td>\"+mg+\"%<\u002Ftd><\u002Ftr>\";});\n    const tg=ti-tc;\n    body=`<div class=\"kpis\"><div class=\"kpi\"><div class=\"n\">$${ti.toFixed(2)}<\u002Fdiv><div class=\"l\">Ingresos/mes<\u002Fdiv><\u002Fdiv><div class=\"kpi\"><div class=\"n\">$${tc.toFixed(2)}<\u002Fdiv><div class=\"l\">Costo operativo/mes<\u002Fdiv><\u002Fdiv><div class=\"kpi\"><div class=\"n\" style=\"color:var(--green)\">$${tg.toFixed(2)}<\u002Fdiv><div class=\"l\">Ganancia/mes<\u002Fdiv><\u002Fdiv><div class=\"kpi\"><div class=\"n\">${ti?Math.round(tg/ti*100):0}%<\u002Fdiv><div class=\"l\">Margen<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"panel\"><table><thead><tr><th>Cliente<\u002Fth><th>Te paga (susc.)<\u002Fth><th>Tu costo<\u002Fth><th>Ganancia<\u002Fth><th>Margen<\u002Fth><\u002Ftr><\u002Fthead><tbody>${r}<\u002Ftbody><\u002Ftable><\u002Fdiv><div class=\"help\" style=\"margin-top:14px\">Si la ganancia da negativa, ese cliente consume más de lo que paga: conviene subir el plan o ajustar su
