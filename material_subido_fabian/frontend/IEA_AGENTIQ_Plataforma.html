<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IEA AGENTIQ · Plataforma de Agentes</title>
<!--
  CÓMO MODIFICAR (fácil):
  • Datos editables → busca "=== DATOS EDITABLES ===" abajo.
  • Agregar agente desde la app: botón "＋ Nuevo agente" (queda guardado en la sesión).
  • Agregar agente fijo → copia un objeto de AGENTS.
  • Colores → variables de :root.
  • O pedile a Claude: "agregá / cambiá esto".
-->
<style>
  :root{
    --bg:#f5f3ec; --panel:#fff; --soft:#efece2; --line:#e6e1d4;
    --txt:#1c2b27; --muted:#5a6b66; --brand:#0b4d3c; --brand2:#1a6b50;
    --green:#16a34a; --amber:#b08d57; --red:#dc2626; --chip:#eef0f4;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.04);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
  button{font-family:inherit;cursor:pointer}
  .hidden{display:none!important}

  /* LOGIN */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1000px 500px at 80% -10%,rgba(11,77,60,.16),transparent),var(--bg)}
  .lcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px 30px;width:360px;box-shadow:0 20px 50px rgba(16,24,40,.10)}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .dot{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:12px}
  .brand b{font-size:16px}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;font-weight:600}
  input,select,textarea{width:100%;background:#fff;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:10px 12px;font-size:14px;outline:none;font-family:inherit}
  input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,77,60,.12)}
  .btn{border:none;border-radius:8px;padding:11px 16px;font-weight:700;font-size:14px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
  .btn.full{width:100%;margin-top:18px}
  .btn.alt{background:#fff;border:1px solid var(--line);color:var(--txt)}
  .sub{color:var(--muted);font-size:13px;margin:4px 0 18px}
  .roles{display:flex;gap:8px;margin-top:16px}
  .roles button{flex:1;background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:9px;font-size:12px;font-weight:600}
  .roles button.on{border-color:var(--brand);color:var(--brand);background:rgba(11,77,60,.06)}

  /* APP */
  #app{display:grid;grid-template-columns:262px 1fr;height:100vh}
  .side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  .side .head{padding:14px 14px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .roleTag{font-size:10px;color:var(--brand);background:rgba(11,77,60,.08);padding:3px 7px;border-radius:6px;font-weight:700;margin-left:auto}
  .tree{flex:1;overflow:auto;padding:8px}
  .item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;color:var(--txt);cursor:pointer;font-weight:500;user-select:none}
  .item:hover{background:var(--soft)}
  .item.on{background:rgba(11,77,60,.10);color:var(--brand);font-weight:600}
  .item .ic{width:16px;text-align:center}
  .item .car{margin-left:auto;color:var(--muted);font-size:11px;transition:transform .15s}
  .item .car.open{transform:rotate(90deg)}
  .item .cnt{margin-left:auto;font-size:11px;color:var(--muted);background:var(--soft);border-radius:10px;padding:1px 7px}
  .children{padding-left:8px;margin:2px 0 6px}
  .child{display:flex;align-items:center;gap:9px;padding:7px 10px 7px 14px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:13px}
  .child:hover{background:var(--soft);color:var(--txt)}
  .child.on{background:var(--soft);color:var(--brand);font-weight:600}
  .child .ag{width:20px;height:20px;border-radius:5px;font-size:9px}
  .addrow{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 14px;border-radius:7px;cursor:pointer;color:var(--brand);font-size:13px;font-weight:600}
  .addrow:hover{background:var(--soft)}
  .side .foot{border-top:1px solid var(--line);padding:10px 14px;font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:space-between}
  .side .foot b{color:var(--txt);display:block}
  .lo{background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:12px;color:var(--muted)}

  .ag{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#fff;flex-shrink:0}

  .main{overflow:auto}
  .bar{position:sticky;top:0;background:rgba(245,246,248,.85);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;justify-content:space-between;gap:14px;z-index:2}
  .bar h1{margin:0;font-size:19px}
  .bar .crumb{font-size:12px;color:var(--muted);margin-bottom:2px}
  .content{padding:22px 26px}
  .help{color:var(--muted);font-size:13px;margin:-6px 0 18px;line-height:1.5;max-width:640px}

  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
  .panel.pad{padding:18px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px;box-shadow:var(--shadow)}
  .kpi .n{font-size:24px;font-weight:800}.kpi .l{color:var(--muted);font-size:12px}

  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;padding:11px 14px;color:var(--muted);font-weight:600;font-size:12px;border-bottom:1px solid var(--line);background:var(--soft)}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px}
  tbody tr{cursor:pointer}tbody tr:hover{background:var(--soft)}
  .mini{font-size:12px;color:var(--muted)}
  .tag2{display:inline-block;background:var(--chip);color:#566;font-size:11px;padding:2px 8px;border-radius:6px;margin:2px 4px 0 0}
  .row{display:flex;align-items:center;gap:10px}
  .dotg{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px}
  .dota{width:8px;height:8px;border-radius:50%;background:var(--amber);display:inline-block;margin-right:5px}
  .badge{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px}
  .b-run{background:rgba(11,77,60,.12);color:var(--brand)}.b-done{background:rgba(22,163,74,.12);color:var(--green)}.b-wait{background:rgba(217,119,6,.14);color:var(--amber)}.b-err{background:rgba(220,38,38,.12);color:var(--red)}.b-pend{background:var(--chip);color:var(--muted)}

  .two{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
  .feed .step{display:flex;gap:11px;padding:6px 0}
  .feed .pin{width:10px;height:10px;border-radius:50%;background:var(--brand);margin-top:4px}
  .feed .step.done .pin{background:var(--green)}.feed .step.wait .pin{background:var(--amber);animation:pulse 1.4s infinite}.feed .step.err .pin{background:var(--red)}
  .feed .rail{display:flex;flex-direction:column;align-items:center}.feed .ln{flex:1;width:2px;background:var(--line);margin-top:3px}.feed .step:last-child .ln{display:none}
  .feed b{font-size:13px;display:block}.feed span{font-size:11px;color:var(--muted)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .wf{border:1px solid var(--line);border-radius:11px;padding:15px;margin-bottom:12px;background:#fff;box-shadow:var(--shadow)}
  .wf .orch{display:flex;align-items:center;gap:10px;margin-bottom:10px}.wf .orch .ag{background:linear-gradient(135deg,#b08d57,#cda349)}
  .members{display:flex;flex-wrap:wrap;gap:8px;padding-left:42px}
  .member{display:flex;align-items:center;gap:7px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px}.member .ag{width:20px;height:20px;font-size:9px;border-radius:5px}

  .toolrow{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 13px;margin-top:8px;font-size:13px}
  .toolchk{display:flex;align-items:center;gap:9px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;cursor:pointer;margin:6px 6px 0 0}
  .toolchk input{width:auto}
  .sw{width:34px;height:19px;border-radius:20px;background:var(--green);position:relative;cursor:pointer}.sw.off{background:#cdd3dd}
  .sw::after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;top:2px;right:2px}.sw.off::after{right:auto;left:2px}
  .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .actions{display:flex;gap:10px;margin-top:18px}
  @media(max-width:900px){#app{grid-template-columns:1fr}.side{display:none}.kpis,.two,.formgrid{grid-template-columns:1fr}}
.chatwrap{display:flex;flex-direction:column;height:calc(100vh - 160px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.chatsel{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.chatlog{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:74%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.45}
.bub.u{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.bub.a{align-self:flex-start;background:var(--soft);color:var(--txt);border-bottom-left-radius:4px}
.bub .nm{font-size:11px;opacity:.7;margin-bottom:3px}
.chatbar{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line)}
.chatbar input{flex:1}
.helpfab{position:fixed;bottom:22px;right:22px;z-index:60;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:none;border-radius:24px;padding:12px 18px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(11,77,60,.35);cursor:pointer}
.helpcard{position:fixed;top:0;right:0;z-index:60;width:380px;max-width:90vw;height:100vh;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(16,24,40,.18);overflow:hidden}
.helphd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:14px}
.helpbody{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.helpbar{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.helpbar input{flex:1}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="lcard">
    <div class="brand"><div class="dot">AQ</div><b>IEA AGENTIQ</b></div>
    <div class="sub">La plataforma donde tus agentes viven y trabajan</div>
    <label>Email</label><input id="email" value="cliente@demo.com">
    <label>Contraseña</label><input type="password" value="demodemo">
    <div class="roles"><button id="rCli" class="on" onclick="setRole('cli')">Cliente</button><button id="rAdm" onclick="setRole('adm')">Administrador</button></div>
    <button class="btn full" onclick="login()">Entrar</button>
    <div class="mini" style="text-align:center;margin-top:12px">Demostración · datos de ejemplo</div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <aside class="side">
    <div class="head"><div class="brand"><div class="dot">AQ</div><b style="font-size:14px">IEA AGENTIQ</b></div><span class="roleTag" id="roleTag">—</span></div>
    <nav class="tree" id="tree"></nav>
    <div class="foot"><div><span class="mini">Conectado</span><b id="whoName">—</b></div><button class="lo" onclick="logout()">Salir</button></div>
  </aside>
  <main class="main"><div id="view"></div></main>
</div>
<div id="modalHost"></div>
<div id="helpWidget"></div>

<script>
/* ====================== DATOS EDITABLES ====================== */
const AGENTS = {
  PR:{n:"Prospector LinkedIn",grupo:"Ventas",modelo:"GPT-5 Nano",idioma:"PT/ES",estado:"activo",d:"Busca y filtra clientes potenciales en LinkedIn.",prompt:"Rol: prospección B2B. SOP: 1) buscar perfiles 2) calificar 3) preparar contacto. Salida JSON.",tools:["Búsqueda web","LinkedIn","Enriquecedor de leads","CRM"]},
  PI:{n:"Prospector IG + Facebook",grupo:"Ventas",modelo:"GPT-5 Nano",idioma:"PT/ES",estado:"activo",d:"Prospección en Instagram y Facebook.",prompt:"Rol: prospección en redes. SOP: buscar → calificar → exportar.",tools:["Búsqueda web","CRM"]},
  CAL:{n:"Calificador de leads",grupo:"Ventas",modelo:"GPT-5 Nano",idioma:"PT/ES",estado:"activo",d:"Enriquece y puntúa contactos.",prompt:"Rol: calificador. SOP: recibir → enriquecer → puntuar. Salida JSON.",tools:["Enriquecedor de leads","Búsqueda web","CRM"]},
  RED:{n:"Redactor de invitaciones",grupo:"Ventas",modelo:"Claude Haiku",idioma:"PT/ES",estado:"activo",d:"Escribe mensajes personalizados.",prompt:"Rol: outreach. SOP: datos del lead → mensaje PT/ES.",tools:["Email (Gmail)","LinkedIn"]},
  WAL:{n:"Limpiador de listas WhatsApp",grupo:"Difusión",modelo:"GPT-5 Nano",idioma:"PT/ES",estado:"activo",d:"Valida, deduplica y segmenta listas.",prompt:"Rol: limpieza. SOP: validar → deduplicar → segmentar.",tools:["CRM","Archivos"]},
  WAD:{n:"Difusor WhatsApp",grupo:"Difusión",modelo:"Claude Haiku",idioma:"PT/ES",estado:"pausa",d:"Campañas de difusión (API oficial).",prompt:"Rol: difusión. SOP: segmentar → redactar → agendar (opt-in).",tools:["WhatsApp (API oficial)","Agenda"]},
  VID:{n:"Fragmentador de video",grupo:"Contenido",modelo:"Claude Sonnet",idioma:"PT/ES",estado:"activo",d:"Corta videos largos en reels.",prompt:"Rol: creativo de video. SOP: transcribir → clips → copy.",tools:["Generación de contenido","Archivos","Agenda"]},
  COP:{n:"Generador de copy + hashtags",grupo:"Contenido",modelo:"Claude Haiku",idioma:"PT/ES",estado:"activo",d:"Textos y etiquetas para IG/FB.",prompt:"Rol: copywriter. SOP: idea → copy → hashtags.",tools:["Generación de contenido","Búsqueda web"]},
  PUB:{n:"Publicador omnicanal",grupo:"Contenido",modelo:"GPT-5 Nano",idioma:"PT/ES",estado:"activo",d:"Programa y publica en IG y Facebook.",prompt:"Rol: publicador. SOP: recibir → agendar → publicar.",tools:["Agenda","Generación de contenido"]},
  B2C:{n:"Primer contacto B2C",grupo:"Clientes finales",modelo:"Claude Haiku",idioma:"PT/ES",estado:"activo",d:"Responde, califica y deriva a WhatsApp.",prompt:"Rol: atención 24/7. SOP: responder → calificar → derivar.",tools:["WhatsApp (API oficial)","CRM"]},
  NUR:{n:"Seguimiento / nurturing",grupo:"Clientes finales",modelo:"GPT-5 Nano",idioma:"PT/ES",estado:"activo",d:"Recordatorios y secuencias.",prompt:"Rol: nurturing. SOP: detectar sin respuesta → secuencia.",tools:["Email (Gmail)","WhatsApp (API oficial)","Agenda"]},
  MET:{n:"Analista de métricas",grupo:"Operación",modelo:"Claude Sonnet",idioma:"PT/ES",estado:"activo",d:"Mide qué rinde mejor y reporta.",prompt:"Rol: analista. SOP: snapshot → datos → cambios → reporte.",tools:["CRM","Búsqueda web","Archivos"]},
};
let WORKFORCES=[
  {n:"Máquina de Adquisición",d:"Embudo completo de captación y venta.",members:["PR","PI","CAL","RED","WAL","WAD"]},
  {n:"Equipo de Contenido",d:"Produce y publica contenido en redes.",members:["VID","COP","PUB"]},
  {n:"Embudo de Clientes",d:"Capta y nutre clientes finales.",members:["B2C","NUR","MET"]},
];
const TOOLS=["Búsqueda web","Extraer texto de URL","Email (Gmail)","WhatsApp (API oficial)","LinkedIn","Enriquecedor de leads","CRM","Archivos","Agenda","Generación de contenido","Notion","HubSpot","Apollo","Zapier (9000+ apps)"];
let CLIENTS=[
  {n:"Centro Aurora",mail:"aurora@demo.com",ag:["PR","VID","WAL"],plan:"Pro",pais:"Brasil",lang:"pt",features:{encuestas:true,flujos:false}},
  {n:"Instituto Theta",mail:"theta@demo.com",ag:["PR","CAL"],plan:"Inicial",pais:"Uruguay",lang:"es",features:{encuestas:false,flujos:false}},
  {n:"Luz Interior",mail:"luz@demo.com",ag:["VID","COP"],plan:"Inicial",pais:"Brasil",lang:"pt",features:{encuestas:false,flujos:true}},
];
const FEATURES=[
{k:"inbox",ic:"📥",n:"Bandeja unificada",d:"WhatsApp, Instagram y email en un lugar",estado:"ok"},
{k:"agenda",ic:"📅",n:"Agenda automática",d:"El agente agenda tus citas",estado:"ok"},
{k:"seguimiento",ic:"🔁",n:"Seguimiento de leads",d:"Recontacta leads fríos solo",estado:"ok"},
{k:"cobros",ic:"💸",n:"Cobros / pagos",d:"Recordatorios y link de pago",estado:"ok"},
{k:"publicador",ic:"📣",n:"Publicar en redes",d:"Contenido publicado por vos",estado:"ok"},
{k:"reporte",ic:"📈",n:"Reporte semanal",d:"Resumen por WhatsApp o email",estado:"ok"},
{k:"voz",ic:"🎙️",n:"Voz clonada",d:"Audios con la voz del terapeuta",estado:"ok"},
{k:"proactivo",ic:"✨",n:"Asistente proactivo",d:"Sugiere acciones sin que se lo pidan",estado:"ok"},
{k:"alertas",ic:"🔔",n:"Alertas inteligentes",d:"Te avisa lo importante",estado:"ok"},
{k:"conocimiento_f",ic:"📚",n:"Base de conocimiento",d:"Responde con tus documentos",estado:"ok"},
{k:"encuestas",ic:"📋",n:"Encuestas",d:"Encuestas a tus clientes",estado:"ok"},
{k:"flujos",ic:"🔀",n:"Flujos",d:"Encadena tus agentes",estado:"ok"},
{k:"portal",ic:"🌐",n:"Portal con tu marca",d:"Tu plataforma con tu logo",estado:"future"},
{k:"pagina",ic:"🔗",n:"Página pública",d:"Tu agente en tu propia web",estado:"future"},
{k:"monetizacion",ic:"🪙",n:"Monetización",d:"Cobrá a tus usuarios por el agente",estado:"future"},
];
const STATUS={run:["b-run","En curso"],done:["b-done","Completada"],wait:["b-wait","Requiere aprobación"],err:["b-err","Error"],pend:["b-pend","Pendiente"]};
let TASKS=[
  {id:1,ag:"PR",cli:"Centro Aurora",t:"Buscar 50 clientes potenciales en Brasil",st:"run",steps:[["done","Tarea recibida","10:02"],["done","Buscando en LinkedIn","10:03"],["done","32 perfiles encontrados","10:07"],["wait","Calificando contactos","ahora"],["pend","Redactar invitaciones",""]]},
  {id:2,ag:"VID",cli:"Centro Aurora",t:"Cortar reels de una clase grabada",st:"wait",steps:[["done","Video transcrito","09:12"],["done","6 clips detectados","09:20"],["wait","Esperando tu aprobación","ahora"]]},
  {id:3,ag:"WAL",cli:"Centro Aurora",t:"Limpiar lista de 1.200 contactos",st:"done",steps:[["done","Lista cargada","Ayer"],["done","180 inválidos removidos","Ayer"],["done","925 listos","Ayer"]]},
  {id:4,ag:"PR",cli:"Instituto Theta",t:"Prospección en São Paulo",st:"run",steps:[["done","Tarea recibida","11:40"],["run","Buscando en LinkedIn","ahora"]]},
];
/* Consumo por agente del cliente (demo). dia = gasto diario; mes = acumulado del mes. Proyección = dia × 30. */
const CONSUMO={PR:{dia:0.60,mes:9.40},VID:{dia:0.35,mes:6.10},WAL:{dia:0.17,mes:3.20},CAL:{dia:0.20,mes:3.00},COP:{dia:0.15,mes:2.40}};
const CLIENT_SALDO=14.30, CLIENT_SUB=29;
const PLAN_PRICE={Pro:49,Inicial:25};
/* ==================== FIN DATOS EDITABLES ==================== */

let role="cli", me="Centro Aurora", current="inicio";
let open={agentes:true,equipos:false,clientes:false};
let agOpen={};
let CHAT=[],chatAgent="";
let helpOpen=false;
let lang="es";

function setRole(r){role=r;document.getElementById("rCli").classList.toggle("on",r==="cli");document.getElementById("rAdm").classList.toggle("on",r==="adm");document.getElementById("email").value=r==="cli"?"cliente@demo.com":"admin@ieaagentiq.com";}
function login(){document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");document.getElementById("roleTag").textContent=role==="cli"?"Cliente":"Admin";document.getElementById("whoName").textContent=role==="cli"?me:"Fabián";current=role==="cli"?"c_tareas":"inicio";lang=role==="cli"?((CLIENTS.find(c=>c.n===me)||{}).lang||"es"):"es";render();}
function logout(){document.getElementById("app").classList.add("hidden");document.getElementById("login").classList.remove("hidden");}
function nav(v){current=v;render();}
function toggle(g){open[g]=!open[g];render();}
function toggAg(id){agOpen[id]=!agOpen[id];render();}
function badge(st){const[c,l]=STATUS[st];return `<span class="badge ${c}">${l}</span>`;}

/* ---------- SIDEBAR (árbol desplegable, estilo programa) ---------- */
function renderTree(){
  let h="";
  if(role==="cli"){
    h+=treeItem("c_tareas","🗒️","Mis tareas");
    h+=treeItem("c_chat","💬","Hablar con un agente");
    h+=treeItem("c_agentes","🤖","Mis agentes");
    h+=treeItem("c_saldo","💳","Consumo y saldo");
    h+=treeItem("c_analitica","📊","Analítica");
    h+=treeItem("c_catalogo","🛒","Catálogo");
    h+=treeItem("c_historial","📑","Historial");
    h+=treeItem("c_api","🔌","Conexión & API");

  }
  h+='<div class="item" onclick="toggleHelp()" style="margin-top:6px"><span class="ic">❓</span> Ayuda</div>';

}

function createAgent(){
  const n=document.getElementById("na_n").value.trim();

  const tools=[...document.querySelectorAll(".toolchk input:checked")].map(c=>c.value);
  const key="A"+(Object.keys(AGENTS).length+1);
  AGENTS[key]={n,grupo:document.getElementById("na_g").value||"General",modelo:document.getElementById("na_m").value.split(" ")[0],idioma:document.getElementById("na_i").value,estado:"activo",d:document.getElementById("na_d").value||"(sin descripción)",prompt:document.getElementById("na_p").value||"",tools:tools.length?tools:["Búsqueda web"]};
  open.agentes=true;current="agent:"+key;render();
}

function tr(h){if(lang!=="pt")return h;for(var i=0;i<DICT.length;i++){h=h.split(DICT[i][0]).join(DICT[i][1]);}return h;}
function setLang(l){lang=l;render();}
function toggleFeat(i,k){CLIENTS[i].features[k]=!CLIENTS[i].features[k];render();}
function modal(html){document.getElementById("modalHost").innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()" style="position:fixed;inset:0;background:rgba(20,24,33,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50"><div class="lcard" style="width:520px;max-height:88vh;overflow:auto;position:relative"><button onclick="closeModal()" style="position:absolute;top:12px;right:14px;background:none;border:none;font-size:20px;color:var(--muted)">✕</button>${html}</div></div>`;}
function closeModal(){document.getElementById("modalHost").innerHTML="";}
function openTask(id){const t=TASKS.find(x=>x.id===id);const ctl=role==='adm'?`<label>Editar instrucción</label><textarea rows="2">${t.t}</textarea><div class="actions"><button class="btn alt" onclick="closeModal()">Pausar</button><button class="btn" onclick="closeModal()">Guardar</button></div>`:(t.st==='wait'?`<div class="actions"><button class="btn alt" onclick="closeModal()">Rechazar</button><button class="btn" onclick="closeModal()">Aprobar</button></div>`:'');modal(`<h2 style="margin:0 0 4px">${t.t}</h2><div class="sub">${AGENTS[t.ag].n} · ${t.cli} · ${STATUS[t.st][1]}</div>${feedFor(t)}${ctl}`);}
function openNew(){const opts=CLIENTS.find(c=>c.n===me).ag;modal(`<h2 style="margin:0 0 4px">Nueva tarea</h2><div class="sub">Decile a tu agente qué querés</div><label>Agente</label><select>${opts.map(a=>`<option>${AGENTS[a].n}</option>`).join("")}</select><label>¿Qué querés que haga?</label><textarea rows="3" placeholder="Ej: Buscar 30 clientes en Río y preparar invitaciones"></textarea><button class="btn full" onclick="closeModal()">Enviar al agente</button>`);}
</script>
